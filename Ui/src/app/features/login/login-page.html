<div class="login">
  <form class="card" (ngSubmit)="submit()">
    <h1>Sign in</h1>
    <p class="lede">SentinelAI shows the security audit for your organisation only.</p>

    @if (demoMode) {
      <p class="demo" role="note">
        Demo mode — no backend is being called, so any email and password will do.
      </p>
    }

    <label for="email">Email</label>
    <input
      id="email"
      name="email"
      type="email"
      autocomplete="username"
      required
      [ngModel]="email()"
      (ngModelChange)="email.set($event)"
    />

    <label for="password">Password</label>
    <input
      id="password"
      name="password"
      type="password"
      autocomplete="current-password"
      required
      [ngModel]="password()"
      (ngModelChange)="password.set($event)"
    />

    @if (error(); as message) {
      <p class="error" role="alert">{{ message }}</p>
    }

    <button type="submit" [disabled]="submitting()">
      {{ submitting() ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>
</div>
