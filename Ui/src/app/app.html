<header class="topbar">
  <a class="brand" routerLink="/">
    <span class="mark" aria-hidden="true"></span>
    SentinelAI
  </a>

  <div class="topbar__right">
    @if (demoMode) {
      <span class="chip" title="No backend is being called; the reference fixture's audit is shown">
        demo data
      </span>
    }

    @if (auth.isAuthenticated()) {
      <span class="who">
        {{ auth.role() }} · <code>{{ auth.tenantId() }}</code>
      </span>
      <button type="button" (click)="signOut()">Sign out</button>
    }
  </div>
</header>

<main>
  <router-outlet />
</main>

<footer class="foot">
  Draft audits are generated for human review. SentinelAI reports paths that exist in your resource
  graph — it does not execute or prove exploits.
</footer>
